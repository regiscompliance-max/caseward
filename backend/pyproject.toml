[project]
name = "caseward"
version = "0.1.0"
description = "Caseward backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pyjwt[crypto]>=2.9",
  "jsonschema>=4.23",
  "pyyaml>=6",
  "boto3>=1.35",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "pytesseract>=0.3.13",
  "httpx>=0.27",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "openapi-spec-validator>=0.7", "moto[s3]>=5", "pypdf>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseward"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
