[project]
name = "caseward"
version = "0.1.0"
description = "Caseward backend"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseward"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
