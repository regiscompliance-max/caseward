        '401': {$ref: 'common.yaml#/components/responses/Unauthorised'}

  /reference/event-types:
    get:
      operationId: listEventTypes
      tags: [Reference]
      summary: Case event types the client can record
      x-roles: [client_admin, client_member, client_viewer]
      x-provider-access: read
      x-audit: none
      parameters:
        - $ref: 'common.yaml#/components/parameters/ActingClient'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: 'common.yaml#/components/schemas/EventType'}
