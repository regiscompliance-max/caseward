openapi: 3.1.0
info:
  title: Caseward shared API components
  version: 0.1.0
  description: >
    Schemas, parameters and responses shared by the client API (client.yaml)
    and the operations API (operations.yaml). Not served on its own.
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token from the identity provider. Must show multi-factor
        authentication (`amr` includes `mfa`), otherwise 401 with code
        `mfa_required`.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor` of the previous page.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated unique key (UUID recommended). Repeating a request
        with the same key within 24 hours returns the original response
        and does nothing else.
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last read. A stale value returns 412.
      schema: {type: string}
    ActingClient:
      name: X-Caseward-Client
      in: header
      description: >
        The client the user is acting as. Required when the user belongs to
        more than one client; otherwise defaults to their only membership.
      schema: {$ref: '#/components/schemas/Uuid'}
    AccessReason:
      name: X-Access-Reason
      in: header
      required: true
      description: >
        Why special-category data is being viewed. Stored in the audit log.
        Sent as a header so it never appears in URLs or access logs.
      schema: {type: string, minLength: 5, maxLength: 500}
    ClientIdFilter:
      name: client_id
      in: query
      schema: {$ref: '#/components/schemas/Uuid'}
    PropertyIdFilter:
      name: property_id
      in: query
      schema: {$ref: '#/components/schemas/Uuid'}
    CaseIdFilter:
      name: case_id
      in: query
      schema: {$ref: '#/components/schemas/Uuid'}
    Id:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    Code:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9_]+$'}

  headers:
    ETag:
      description: Version of the resource, for If-Match on updates.
      schema: {type: string}
    RequestId:
      description: Request id, also recorded on every audit event.
      schema: {type: string}
    Location:
      schema: {type: string, format: uri-reference}

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorised:
      description: Missing or invalid token, or no multi-factor authentication.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Authenticated, but the role does not allow this action.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: >
        Not found, or not visible to this user. The two are never
        distinguished, so ids from other clients reveal nothing.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: The request conflicts with current state (for example, a duplicate document).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: If-Match did not match. Re-read and try again.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnprocessableContent:
      description: >
        Valid shape, but breaks a rule (for example, approving your own
        letter or using a rule that is not approved).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Rate limit reached. See Retry-After.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # -- Primitives ---------------------------------------------------------
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339. Responses are always UTC (`Z`).
    LocalDate:
      type: string
      format: date
      description: A calendar date in UK time (Europe/London).
    Jsonb:
      type: object
      additionalProperties: true

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code:
          type: string
          description: Stable machine-readable error code, e.g. `duplicate_document`, `self_approval`.
          examples: [duplicate_document]
        request_id: {type: string}
        existing_document_id:
          $ref: '#/components/schemas/Uuid'
          description: With `duplicate_document` and `upload_already_used`, the document that already exists.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}

    PageMeta:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Null on the last page.

    SubjectRef:
      type: object
      required: [kind, id]
      properties:
        kind: {type: string, enum: [case, defect, inspection]}
        id: {$ref: '#/components/schemas/Uuid'}

    # -- Enumerations (kept in step with database CHECK constraints by tests) --
    ClientKind:
      type: string
      enum: [landlord, contractor, managing_agent, legal]
    StaffRole:
      type: string
      enum: [case_handler, quality_analyst, compliance_lead, admin]
    MembershipRole:
      type: string
      enum: [client_admin, client_member, client_viewer]
    Jurisdiction:
      type: string
      enum: [england, wales, scotland, northern_ireland]
    DocType:
      type: string
      enum: [certificate, hazard_report, contractor_report, photo, correspondence, other]
    DocumentSource:
      type: string
      enum: [upload, email, portal, api]
    MalwareScan:
      type: string
      enum: [pending, clean, infected, error]
    ExtractionStatus:
      type: string
      enum: [pending, running, succeeded, failed]
    ReviewDecision:
      type: string
      enum: [approved, corrected, rejected]
    InspectionOutcome:
      type: string
      enum: [satisfactory, unsatisfactory, unknown]
    DefectStatus:
      type: string
      enum: [open, in_progress, remediated, verified, closed, not_required]
    Severity:
      type: string
      enum: [emergency, significant, other]
    CaseStatus:
      type: string
      enum: [open, investigating, awaiting_works, works_in_progress, resolved, closed, withdrawn]
    AwarenessSource:
      type: string
      enum: [tenant_report, inspection, contractor, third_party, other]
    EventChannel:
      type: string
      enum: [phone, email, letter, in_person, portal, other]
    DeadlineStatus:
      type: string
      enum: [open, met, missed, cancelled]
    AlertLevel:
      type: string
      enum: [on_track, alert_50, alert_80, overdue]
    DeadlineAlertLevel:
      type: string
      enum: [alert_50, alert_80, overdue]
    LetterStatus:
      type: string
      enum: [drafting, draft_ready, approved, sent, void]
    LetterChannel:
      type: string
      enum: [post, email, portal]
    RecipientKind:
      type: string
      enum: [tenant, contractor]
    TemplateVariant:
      type: string
      enum: [standard, large_print, easy_read]
    TaskKind:
      type: string
      enum: [review_extraction, triage_case, draft_letter, approve_letter, chase_works, other]
    TaskStatus:
      type: string
      enum: [queued, in_progress, blocked, done, cancelled]
    PreferredChannel:
      type: string
      enum: [post, email, phone, portal]
    VulnerabilitySource:
      type: string
      enum: [tenant, support_worker, landlord_record, other]
    RuleStatus:
      type: string
      enum: [draft, approved, retired]
    DurationUnit:
      type: string
      enum: [hours, days, months]
    DayType:
      type: string
      enum: [working, calendar]

    # -- Identity ------------------------------------------------------------
    Me:
      type: object
      required: [user, memberships]
      properties:
        user: {$ref: '#/components/schemas/User'}
        memberships:
          type: array
          items: {$ref: '#/components/schemas/Membership'}
        acting_client_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]

    User:
      type: object
      required: [id, email, display_name, is_active]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        display_name: {type: string}
        staff_role:
          oneOf: [{$ref: '#/components/schemas/StaffRole'}, {type: 'null'}]
        is_active: {type: boolean}
        row_version: {type: string, description: Send as If-Match when updating.}

    UserInvite:
      type: object
      required: [email, display_name]
      properties:
        email: {type: string, format: email}
        display_name: {type: string, minLength: 1}
        staff_role:
          oneOf: [{$ref: '#/components/schemas/StaffRole'}, {type: 'null'}]

    UserUpdate:
      type: object
      minProperties: 1
      properties:
        display_name: {type: string, minLength: 1}
        staff_role:
          oneOf: [{$ref: '#/components/schemas/StaffRole'}, {type: 'null'}]
        is_active: {type: boolean}

    Membership:
      type: object
      required: [user_id, client_id, client_name, client_kind, role, special_category_access]
      properties:
        user_id: {$ref: '#/components/schemas/Uuid'}
        client_id: {$ref: '#/components/schemas/Uuid'}
        client_name: {type: string}
        client_kind: {$ref: '#/components/schemas/ClientKind'}
        role: {$ref: '#/components/schemas/MembershipRole'}
        special_category_access: {type: boolean}

    MembershipPut:
      type: object
      required: [role]
      properties:
        role: {$ref: '#/components/schemas/MembershipRole'}
        special_category_access: {type: boolean, default: false}

    Client:
      type: object
      required: [id, name, kind]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        kind: {$ref: '#/components/schemas/ClientKind'}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    ClientCreate:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1}
        kind: {$ref: '#/components/schemas/ClientKind'}

    Engagement:
      type: object
      required: [id, landlord_client_id, provider_client_id, starts_on]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        landlord_client_id: {$ref: '#/components/schemas/Uuid'}
        provider_client_id: {$ref: '#/components/schemas/Uuid'}
        starts_on: {$ref: '#/components/schemas/LocalDate'}
        ends_on:
          oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]

    EngagementCreate:
      type: object
      required: [provider_client_id, starts_on]
      properties:
        provider_client_id: {$ref: '#/components/schemas/Uuid'}
        starts_on: {$ref: '#/components/schemas/LocalDate'}
        ends_on: {$ref: '#/components/schemas/LocalDate'}

    # -- Properties and tenants ---------------------------------------------
    Property:
      type: object
      required: [id, client_id, address_line_1, postcode, jurisdiction]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        client_id: {$ref: '#/components/schemas/Uuid'}
        uprn: {type: [integer, 'null'], minimum: 1, maximum: 999999999999}
        address_line_1: {type: string}
        address_line_2: {type: [string, 'null']}
        town: {type: [string, 'null']}
        postcode: {type: string}
        jurisdiction: {$ref: '#/components/schemas/Jurisdiction'}

    PropertyCreate:
      type: object
      required: [address_line_1, postcode, jurisdiction]
      properties:
        uprn: {type: integer, minimum: 1, maximum: 999999999999}
        address_line_1: {type: string, minLength: 1}
        address_line_2: {type: string}
        town: {type: string}
        postcode: {type: string, minLength: 5, maxLength: 8}
        jurisdiction: {$ref: '#/components/schemas/Jurisdiction'}

    Tenancy:
      type: object
      required: [id, property_id, starts_on]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        property_id: {$ref: '#/components/schemas/Uuid'}
        starts_on: {$ref: '#/components/schemas/LocalDate'}
        ends_on:
          oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]
        contacts:
          type: array
          items: {$ref: '#/components/schemas/TenantContact'}

    TenancyCreate:
      type: object
      required: [starts_on]
      properties:
        starts_on: {$ref: '#/components/schemas/LocalDate'}
        ends_on: {$ref: '#/components/schemas/LocalDate'}

    TenantContact:
      type: object
      description: Minimal fields only. Anything more needs a documented lawful basis.
      required: [id, tenancy_id, full_name]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        tenancy_id: {$ref: '#/components/schemas/Uuid'}
        full_name: {type: string}
        phone: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        preferred_channel:
          oneOf: [{$ref: '#/components/schemas/PreferredChannel'}, {type: 'null'}]
        row_version: {type: string, description: Send as If-Match when updating.}

    TenantContactWrite:
      type: object
      properties:
        full_name: {type: string, minLength: 1}
        phone: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        preferred_channel:
          oneOf: [{$ref: '#/components/schemas/PreferredChannel'}, {type: 'null'}]

    Vulnerability:
      type: object
      description: Special-category data.
      required: [id, factor, factor_name, source, recorded_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        factor: {type: string}
        factor_name: {type: string}
        notes: {type: [string, 'null']}
        source: {$ref: '#/components/schemas/VulnerabilitySource'}
        recorded_at: {$ref: '#/components/schemas/Timestamp'}
        ended_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]

    VulnerabilityCreate:
      type: object
      required: [factor, source]
      properties:
        factor: {type: string, description: A vulnerability_factor_type code.}
        source: {$ref: '#/components/schemas/VulnerabilitySource'}
        notes: {type: string, maxLength: 2000}

    # -- Documents and extraction ------------------------------------------
    UploadCreate:
      type: object
      required: [filename, mime_type, size_bytes, sha256]
      properties:
        filename: {type: string, maxLength: 255}
        mime_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/tiff, image/heic, message/rfc822]
        size_bytes: {type: integer, minimum: 1, maximum: 104857600}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}

    Upload:
      type: object
      required: [upload_id, put_url, expires_at]
      description: >
        PUT the file bytes to `put_url` (UK storage, private bucket) before
        `expires_at`, then create the document with `upload_id`.
      properties:
        upload_id: {$ref: '#/components/schemas/Uuid'}
        put_url: {type: string, format: uri}
        required_headers:
          type: object
          additionalProperties: {type: string}
        expires_at: {$ref: '#/components/schemas/Timestamp'}

    DocumentCreate:
      type: object
      required: [upload_id, doc_type, received_at]
      properties:
        upload_id: {$ref: '#/components/schemas/Uuid'}
        doc_type: {$ref: '#/components/schemas/DocType'}
        certificate_type: {type: string, description: A certificate_type code, if known.}
        property_id: {$ref: '#/components/schemas/Uuid'}
        received_at: {$ref: '#/components/schemas/Timestamp'}

    Document:
      type: object
      required: [id, client_id, doc_type, source, received_at, sha256, mime_type, size_bytes, malware_scan, processing]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        client_id: {$ref: '#/components/schemas/Uuid'}
        property_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        doc_type: {$ref: '#/components/schemas/DocType'}
        certificate_type: {type: [string, 'null']}
        source: {$ref: '#/components/schemas/DocumentSource'}
        received_at: {$ref: '#/components/schemas/Timestamp'}
        original_filename: {type: [string, 'null']}
        sha256: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer}
        malware_scan: {$ref: '#/components/schemas/MalwareScan'}
        processing:
          type: string
          description: Overall progress for display.
          enum: [scanning, reading, awaiting_review, complete, rejected, failed]
        created_at: {$ref: '#/components/schemas/Timestamp'}

    ExtractionFlag:
      type: object
      required: [field, reason]
      properties:
        field: {type: string, description: JSON pointer into `result`.}
        reason:
          type: string
          enum: [low_confidence, contradiction, missing_required, invalid_value, date_out_of_range]
        detail: {type: string, examples: ['Outcome "Satisfactory" with a C2 code present']}

    Extraction:
      type: object
      description: Raw AI output. Operations API only. Clients see approved results through inspections and defects.
      required: [id, document_id, status, model_provider, model_version, prompt_id, prompt_version, output_schema_version, flags]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        document_id: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/ExtractionStatus'}
        result:
          oneOf: [{$ref: '#/components/schemas/Jsonb'}, {type: 'null'}]
        field_confidence:
          type: [object, 'null']
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        flags:
          type: array
          items: {$ref: '#/components/schemas/ExtractionFlag'}
        model_provider: {type: string}
        model_version: {type: string}
        prompt_id: {type: string}
        prompt_version: {type: string}
        output_schema_version: {type: string}
        error: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        completed_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        review:
          oneOf: [{$ref: '#/components/schemas/ExtractionReview'}, {type: 'null'}]

    ExtractionReviewCreate:
      type: object
      required: [decision]
      properties:
        decision: {$ref: '#/components/schemas/ReviewDecision'}
        approved_result:
          $ref: '#/components/schemas/Jsonb'
          description: Required unless rejected. Validated against the output schema for the certificate type.
        notes: {type: string, maxLength: 4000}
        property_id:
          $ref: '#/components/schemas/Uuid'
          description: Links the document to this property first, if it has none or the wrong one.
      if:
        properties: {decision: {const: rejected}}
      then:
        required: [decision, notes]
      else:
        required: [decision, approved_result]

    ExtractionReview:
      type: object
      required: [id, extraction_id, reviewer_id, decision, reviewed_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        extraction_id: {$ref: '#/components/schemas/Uuid'}
        reviewer_id: {$ref: '#/components/schemas/Uuid'}
        decision: {$ref: '#/components/schemas/ReviewDecision'}
        approved_result:
          oneOf: [{$ref: '#/components/schemas/Jsonb'}, {type: 'null'}]
        notes: {type: [string, 'null']}
        reviewed_at: {$ref: '#/components/schemas/Timestamp'}
        created:
          type: object
          description: Records created from the approved result.
          properties:
            inspection_id:
              oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
            defect_ids:
              type: array
              items: {$ref: '#/components/schemas/Uuid'}

    # -- Inspections and defects -------------------------------------------
    Inspection:
      type: object
      required: [id, property_id, certificate_type, inspected_on, outcome]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        property_id: {$ref: '#/components/schemas/Uuid'}
        document_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        certificate_type: {type: string}
        inspected_on: {$ref: '#/components/schemas/LocalDate'}
        next_due_on:
          oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]
        engineer_name: {type: [string, 'null']}
        engineer_registration: {type: [string, 'null']}
        outcome: {$ref: '#/components/schemas/InspectionOutcome'}
        defects:
          type: array
          items: {$ref: '#/components/schemas/Defect'}

    Defect:
      type: object
      required: [id, property_id, code_scheme, code, description, status, identified_on]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        property_id: {$ref: '#/components/schemas/Uuid'}
        inspection_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        code_scheme: {type: string, examples: [eicr]}
        code: {type: string, examples: [C2]}
        description: {type: string}
        location: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/DefectStatus'}
        identified_on: {$ref: '#/components/schemas/LocalDate'}
        closed_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        case_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}

    DefectUpdate:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/DefectStatus'}
        note: {type: string, maxLength: 2000}

    # -- Cases -------------------------------------------------------------
    CaseCreate:
      type: object
      required: [property_id, hazard_category, severity, received_at, aware_at, awareness_source]
      properties:
        property_id: {$ref: '#/components/schemas/Uuid'}
        reference:
          type: string
          description: The client's own reference. Generated if omitted.
        hazard_category: {type: string, description: A hazard_category code.}
        severity: {$ref: '#/components/schemas/Severity'}
        received_at: {$ref: '#/components/schemas/Timestamp'}
        aware_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the landlord became aware. Usually starts the clock.
        awareness_source: {$ref: '#/components/schemas/AwarenessSource'}
        awareness_evidence_document_id: {$ref: '#/components/schemas/Uuid'}
        defect_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
        description: {type: string, maxLength: 4000}

    CaseUpdate:
      type: object
      minProperties: 1
      properties:
        status: {$ref: '#/components/schemas/CaseStatus'}
        severity:
          $ref: '#/components/schemas/Severity'
          description: Changing severity cancels and recalculates open deadlines.
        assigned_contractor_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        reason: {type: string, maxLength: 2000}

    Case:
      type: object
      required: [id, client_id, property_id, reference, hazard_category, severity, received_at, aware_at, awareness_source, status]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        client_id: {$ref: '#/components/schemas/Uuid'}
        property_id: {$ref: '#/components/schemas/Uuid'}
        reference: {type: string}
        hazard_category: {type: string}
        hazard_category_name: {type: string}
        severity: {$ref: '#/components/schemas/Severity'}
        received_at: {$ref: '#/components/schemas/Timestamp'}
        aware_at: {$ref: '#/components/schemas/Timestamp'}
        awareness_source: {$ref: '#/components/schemas/AwarenessSource'}
        assigned_contractor_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        status: {$ref: '#/components/schemas/CaseStatus'}
        closed_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        next_deadline:
          oneOf: [{$ref: '#/components/schemas/Deadline'}, {type: 'null'}]
        defect_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}

    CaseEventCreate:
      type: object
      required: [kind, occurred_at]
      properties:
        kind: {type: string, description: An event_type code for subject kind `case`.}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
        channel: {$ref: '#/components/schemas/EventChannel'}
        notes: {type: string, maxLength: 4000}
        evidence_document_id: {$ref: '#/components/schemas/Uuid'}
        contractor_client_id: {$ref: '#/components/schemas/Uuid'}
        corrects_event_id:
          $ref: '#/components/schemas/Uuid'
          description: Events cannot be edited. A correction is a new event naming the one it corrects.

    CaseEvent:
      type: object
      required: [id, case_id, kind, kind_name, is_excuse_evidence, occurred_at, recorded_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        case_id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string}
        kind_name: {type: string}
        is_excuse_evidence: {type: boolean}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
        channel:
          oneOf: [{$ref: '#/components/schemas/EventChannel'}, {type: 'null'}]
        notes: {type: [string, 'null']}
        evidence_document_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        contractor_client_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        corrects_event_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        corrected_by_event_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        recorded_by:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        recorded_at: {$ref: '#/components/schemas/Timestamp'}
        deadlines_met:
          type: array
          description: Deadlines this event completed.
          items: {$ref: '#/components/schemas/Uuid'}

    TimelineEntry:
      type: object
      description: One entry on a case timeline, in time order.
      required: [entry_type, at, summary]
      properties:
        entry_type: {type: string, enum: [event, status_change, deadline, letter, document]}
        at: {$ref: '#/components/schemas/Timestamp'}
        summary: {type: string}
        event:
          $ref: '#/components/schemas/CaseEvent'
        status_change:
          type: object
          properties:
            from_status:
              oneOf: [{$ref: '#/components/schemas/CaseStatus'}, {type: 'null'}]
            to_status: {$ref: '#/components/schemas/CaseStatus'}
            changed_by:
              oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        deadline: {$ref: '#/components/schemas/Deadline'}
        letter_id: {$ref: '#/components/schemas/Uuid'}
        document_id: {$ref: '#/components/schemas/Uuid'}

    # -- Deadlines ---------------------------------------------------------
    Deadline:
      type: object
      required: [id, subject, rule, clock_started_at, due_at, due_local_date, status]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        subject: {$ref: '#/components/schemas/SubjectRef'}
        rule:
          type: object
          required: [key, version, title]
          properties:
            key: {type: string}
            version: {type: integer}
            title: {type: string}
            rule_pack: {type: string}
        clock_started_at: {$ref: '#/components/schemas/Timestamp'}
        due_at: {$ref: '#/components/schemas/Timestamp'}
        due_local_date: {$ref: '#/components/schemas/LocalDate'}
        status: {$ref: '#/components/schemas/DeadlineStatus'}
        completed_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        alert_level:
          oneOf: [{$ref: '#/components/schemas/AlertLevel'}, {type: 'null'}]
          description: Null once completed or cancelled.
        elapsed_fraction: {type: [number, 'null']}

    DeadlineAlert:
      type: object
      description: >
        Raised once per level when a deadline reaches 50% or 80% of its time,
        or is overdue. A late sweep raises only the highest level reached.
      required: [id, client_id, level, raised_at, deadline]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        client_id: {$ref: '#/components/schemas/Uuid'}
        client_name: {type: string}
        level: {$ref: '#/components/schemas/DeadlineAlertLevel'}
        raised_at: {$ref: '#/components/schemas/Timestamp'}
        acknowledged_by:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        acknowledged_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        deadline: {$ref: '#/components/schemas/Deadline'}

    DeadlineCancel:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 5, maxLength: 2000}
        recompute:
          type: boolean
          default: true
          description: Queue recalculation for the subject after cancelling.

    # -- Letters -----------------------------------------------------------
    ApprovedLetter:
      type: object
      description: The only letter view clients get. Drafts are never exposed to clients.
      required: [id, status, recipient_kind, channel, approved_text, approved_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        case_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        status: {type: string, enum: [approved, sent]}
        recipient_kind: {$ref: '#/components/schemas/RecipientKind'}
        channel: {$ref: '#/components/schemas/LetterChannel'}
        language: {type: string}
        variant: {$ref: '#/components/schemas/TemplateVariant'}
        approved_text: {type: string}
        approved_at: {$ref: '#/components/schemas/Timestamp'}
        sent_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]

    LetterCreate:
      type: object
      required: [template_id, recipient_kind, channel]
      properties:
        case_id: {$ref: '#/components/schemas/Uuid'}
        template_id: {$ref: '#/components/schemas/Uuid'}
        recipient_kind: {$ref: '#/components/schemas/RecipientKind'}
        recipient_contact_id: {$ref: '#/components/schemas/Uuid'}
        recipient_client_id: {$ref: '#/components/schemas/Uuid'}
        channel: {$ref: '#/components/schemas/LetterChannel'}
        ai_draft:
          type: boolean
          default: true
          description: Queue an AI draft. If false, the first version is written by hand.

    LetterVersion:
      type: object
      required: [version, body, origin, created_at]
      properties:
        version: {type: integer}
        body: {type: string}
        origin: {type: string, enum: [template, ai_draft, human_edit]}
        model_provider: {type: [string, 'null']}
        model_version: {type: [string, 'null']}
        prompt_id: {type: [string, 'null']}
        prompt_version: {type: [string, 'null']}
        created_by:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        created_at: {$ref: '#/components/schemas/Timestamp'}

    LetterVersionCreate:
      type: object
      required: [body, based_on_version]
      properties:
        body: {type: string, minLength: 1}
        based_on_version:
          type: integer
          description: The latest version, or 409 if someone else saved in the meantime.

    Letter:
      type: object
      required: [id, client_id, template_id, recipient_kind, channel, status, versions]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        client_id: {$ref: '#/components/schemas/Uuid'}
        case_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        template_id: {$ref: '#/components/schemas/Uuid'}
        recipient_kind: {$ref: '#/components/schemas/RecipientKind'}
        recipient_contact_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        recipient_client_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        channel: {$ref: '#/components/schemas/LetterChannel'}
        status: {$ref: '#/components/schemas/LetterStatus'}
        versions:
          type: array
          items: {$ref: '#/components/schemas/LetterVersion'}
        approved_version: {type: [integer, 'null']}
        approved_by:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        approved_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        sent_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        delivery_evidence_document_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]

    LetterApprove:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: The version being approved. Must be the latest, and not written by the approver.

    LetterSent:
      type: object
      required: [sent_at]
      properties:
        sent_at: {$ref: '#/components/schemas/Timestamp'}
        delivery_evidence_document_id: {$ref: '#/components/schemas/Uuid'}

    # -- Work queue and quality -------------------------------------------
    Task:
      type: object
      required: [id, client_id, kind, status, priority]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        client_id: {$ref: '#/components/schemas/Uuid'}
        client_name: {type: string}
        kind: {$ref: '#/components/schemas/TaskKind'}
        subject:
          type: [object, 'null']
          properties:
            kind: {type: string, enum: [extraction, case, defect, letter, document]}
            id: {$ref: '#/components/schemas/Uuid'}
        assignee_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        status: {$ref: '#/components/schemas/TaskStatus'}
        priority: {type: integer, minimum: 1, maximum: 5}
        sla_due_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        earliest_deadline_due_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
          description: The nearest open legal deadline linked to the subject. The queue sorts by priority, then this.
        note: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        started_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        completed_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]

    TaskUpdate:
      type: object
      minProperties: 1
      properties:
        status: {type: string, enum: [queued, in_progress, blocked, cancelled]}
        assignee_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        priority: {type: integer, minimum: 1, maximum: 5}
        note: {type: string, maxLength: 2000}

    TaskClaim:
      type: object
      properties:
        kinds:
          type: array
          items: {$ref: '#/components/schemas/TaskKind'}
        client_id: {$ref: '#/components/schemas/Uuid'}

    QualityReviewCreate:
      type: object
      required: [score]
      properties:
        score: {type: integer, minimum: 1, maximum: 5}
        notes: {type: string, maxLength: 4000}

    QualityReview:
      type: object
      required: [id, task_id, reviewer_id, score, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        task_id: {$ref: '#/components/schemas/Uuid'}
        reviewer_id: {$ref: '#/components/schemas/Uuid'}
        score: {type: integer, minimum: 1, maximum: 5}
        notes: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    # -- Reports and exports ----------------------------------------------
    ExportCreate:
      type: object
      required: [kind, format]
      properties:
        kind:
          type: string
          enum: [deadline_performance, case_evidence_pack, certificate_register, open_defects, audit_log]
          description: >
            `case_evidence_pack` is the full timeline with documents, photos and
            letters for the Housing Ombudsman, the regulator or a court.
        format: {type: string, enum: [csv, pdf]}
        filters:
          type: object
          properties:
            case_id: {$ref: '#/components/schemas/Uuid'}
            property_id: {$ref: '#/components/schemas/Uuid'}
            from: {$ref: '#/components/schemas/LocalDate'}
            to: {$ref: '#/components/schemas/LocalDate'}
            hazard_category: {type: string}
            contractor_client_id: {$ref: '#/components/schemas/Uuid'}

    Export:
      type: object
      required: [id, kind, format, status, requested_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string}
        format: {type: string, enum: [csv, pdf]}
        status: {type: string, enum: [queued, running, ready, failed, expired]}
        requested_at: {$ref: '#/components/schemas/Timestamp'}
        ready_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        expires_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        error: {type: [string, 'null']}

    DashboardSummary:
      type: object
      required: [as_of, deadlines, cases, certificates]
      properties:
        as_of: {$ref: '#/components/schemas/Timestamp'}
        deadlines:
          type: object
          required: [on_track, alert_50, alert_80, overdue, met_last_30_days, missed_last_30_days]
          properties:
            on_track: {type: integer}
            alert_50: {type: integer}
            alert_80: {type: integer}
            overdue: {type: integer}
            met_last_30_days: {type: integer}
            missed_last_30_days: {type: integer}
        cases:
          type: object
          required: [open, emergency_open]
          properties:
            open: {type: integer}
            emergency_open: {type: integer}
            by_status:
              type: object
              additionalProperties: {type: integer}
        certificates:
          type: object
          required: [expired, due_within_30_days]
          properties:
            expired: {type: integer}
            due_within_30_days: {type: integer}
            by_type:
              type: object
              additionalProperties: {type: integer}

    # -- Configuration -----------------------------------------------------
    RulePack:
      type: object
      required: [code, name, status]
      properties:
        code: {type: string}
        name: {type: string}
        status: {type: string, enum: ['off', live]}
        approved_by:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        approved_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        approval_reference:
          type: [string, 'null']
          description: The qualified person's confirmation recorded when the pack was switched on.

    ClientRulePack:
      type: object
      required: [rule_pack, enabled_from]
      properties:
        rule_pack: {type: string}
        enabled_from: {$ref: '#/components/schemas/LocalDate'}
        enabled_to:
          oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]

    CertificateType:
      type: object
      required: [code, rule_pack, name]
      properties:
        code: {type: string}
        rule_pack: {type: string}
        name: {type: string}

    DefectCode:
      type: object
      required: [scheme, code, name, rule_pack]
      properties:
        scheme: {type: string}
        code: {type: string}
        name: {type: string}
        rule_pack: {type: string}

    EventType:
      type: object
      required: [code, subject_kind, name, is_excuse_evidence]
      properties:
        code: {type: string}
        subject_kind: {type: string, enum: [case, defect, inspection]}
        name: {type: string}
        is_excuse_evidence: {type: boolean}
        rule_pack: {type: [string, 'null']}

    HazardCategory:
      type: object
      required: [code, name, rule_pack]
      properties:
        code: {type: string}
        name: {type: string}
        rule_pack: {type: string}
        phase: {type: [integer, 'null']}
        in_scope_from:
          oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]
        row_version:
          type: string
          description: Send as If-Match when updating.

    HazardCategoryUpdate:
      type: object
      minProperties: 1
      properties:
        phase: {type: [integer, 'null'], minimum: 1}
        in_scope_from:
          oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]

    VulnerabilityFactorType:
      type: object
      required: [code, name, rule_pack]
      properties:
        code: {type: string}
        name: {type: string}
        rule_pack: {type: string}

    DeadlineRuleCreate:
      type: object
      required: [rule_pack, rule_key, title, description, jurisdiction, subject_kind, applies_to, trigger_event, completion_event, duration, duration_unit]
      properties:
        rule_pack: {type: string}
        rule_key: {type: string, pattern: '^[a-z0-9_.-]+$'}
        title: {type: string}
        description: {type: string}
        legal_reference: {type: [string, 'null']}
        jurisdiction: {$ref: '#/components/schemas/Jurisdiction'}
        subject_kind: {type: string, enum: [case, defect, inspection]}
        applies_to: {type: string, description: "Severity, defect 'scheme:code', certificate type, or '*'."}
        trigger_event: {type: string}
        completion_event: {type: string}
        duration: {type: integer, minimum: 1}
        duration_unit: {$ref: '#/components/schemas/DurationUnit'}
        day_type:
          oneOf: [{$ref: '#/components/schemas/DayType'}, {type: 'null'}]

    DeadlineRule:
      allOf:
        - $ref: '#/components/schemas/DeadlineRuleCreate'
        - type: object
          required: [id, version, status, authored_by]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            version: {type: integer}
            status: {$ref: '#/components/schemas/RuleStatus'}
            authored_by: {$ref: '#/components/schemas/Uuid'}
            approved_by:
              oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
            approved_at:
              oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
            effective_from:
              oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]
            effective_to:
              oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]
            verified:
              type: boolean
              description: False until approved. The UI shows unapproved rules as UNVERIFIED.
            approval_reference:
              type: [string, 'null']
              description: The qualified person's confirmation given at approval.

    DeadlineRuleApprove:
      type: object
      required: [effective_from, confirmation]
      properties:
        effective_from: {$ref: '#/components/schemas/LocalDate'}
        supersedes_version:
          type: integer
          description: The current approved version, which is given `effective_to` = this `effective_from`.
        confirmation:
          type: string
          description: The qualified person's confirmation, e.g. a reference to their written sign-off.
          minLength: 5

    DeadlineRuleTestCase:
      type: object
      required: [clock_started_at]
      properties:
        clock_started_at: {$ref: '#/components/schemas/Timestamp'}
        jurisdiction: {$ref: '#/components/schemas/Jurisdiction'}

    DeadlineRuleTestResult:
      type: object
      required: [due_at, due_local_date, holiday_calendar_id, calculator_version]
      properties:
        due_at: {$ref: '#/components/schemas/Timestamp'}
        due_local_date: {$ref: '#/components/schemas/LocalDate'}
        holiday_calendar_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        calculator_version: {type: string}

    HolidayCalendar:
      type: object
      required: [id, region, version, source, published_at, holiday_count]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        region: {type: string, enum: [england-and-wales, scotland, northern-ireland]}
        version: {type: integer}
        source: {type: string}
        published_at: {$ref: '#/components/schemas/Timestamp'}
        holiday_count: {type: integer}
        first_date: {$ref: '#/components/schemas/LocalDate'}
        last_date: {$ref: '#/components/schemas/LocalDate'}

    LetterTemplateCreate:
      type: object
      required: [template_key, title, body]
      properties:
        client_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Null for a template every client can use.
        rule_pack: {type: [string, 'null']}
        template_key: {type: string}
        language: {type: string, default: en-GB}
        variant: {$ref: '#/components/schemas/TemplateVariant'}
        title: {type: string}
        body:
          type: string
          description: >
            Plain text with merge fields such as {{ recipient_name }} and
            {{ next_deadline_date }}. {{ ai_summary }} is the only part AI writes.
            Unknown fields are refused.
        case_event_kind:
          type: [string, 'null']
          description: The case event recorded when a letter from this template is sent, e.g. written_summary_sent.

    LetterTemplate:
      allOf:
        - $ref: '#/components/schemas/LetterTemplateCreate'
        - type: object
          required: [id, version, status]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            version: {type: integer}
            status: {$ref: '#/components/schemas/RuleStatus'}
            approved_by:
              oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
            approved_at:
              oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
            created_by:
              oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]

    # -- Audit and operations ---------------------------------------------
    AuditEvent:
      type: object
      required: [id, occurred_at, actor_kind, action, entity_type]
      properties:
        id: {type: integer}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
        actor_user_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        actor_kind: {type: string, enum: [user, worker, system]}
        client_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        action: {type: string, examples: [insert, update, view, export]}
        entity_type: {type: string}
        entity_id: {type: [string, 'null']}
        request_id: {type: [string, 'null']}
        source_ip: {type: [string, 'null']}
        changed_fields:
          type: [array, 'null']
          items: {type: string}
        before:
          oneOf: [{$ref: '#/components/schemas/Jsonb'}, {type: 'null'}]
        after:
          oneOf: [{$ref: '#/components/schemas/Jsonb'}, {type: 'null'}]

    AuditVerification:
      type: object
      required: [intact, checked_at, last_event_id]
      properties:
        intact: {type: boolean}
        first_broken_event_id: {type: [integer, 'null']}
        last_event_id: {type: integer}
        checked_at: {$ref: '#/components/schemas/Timestamp'}

    JobSummary:
      type: object
      required: [as_of, by_kind]
      properties:
        as_of: {$ref: '#/components/schemas/Timestamp'}
        by_kind:
          type: array
          items:
            type: object
            required: [kind, queued, running, dead]
            properties:
              kind: {type: string}
              queued: {type: integer}
              running: {type: integer}
              dead: {type: integer}
              oldest_queued_at:
                oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
